<svg xmlns="http://www.w3.org/2000/svg" width="640" height="3077" viewBox="0 0 640 3077" role="img" aria-labelledby="title"><title id="title">Joey Yang Lab dashboard: safety systems, AI and knowledge infrastructure</title><rect width="640" height="3077" rx="16" fill="#0d1117"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="65" font-size="42" fill="#eef3f8" font-weight="700">Hey, I’m Joey</text><text x="28" y="105" font-size="21" fill="#eef3f8" font-weight="600">Safety Systems × AI × Knowledge Infrastructure</text><text x="28" y="153" font-size="21" fill="#b9c3ce" font-weight="400">I work at the intersection of safety,</text><text x="28" y="185" font-size="21" fill="#b9c3ce" font-weight="400">operational risk, AI, and knowledge systems.</text><text x="28" y="217" font-size="21" fill="#b9c3ce" font-weight="400">My main interest is simple:</text><text x="46" y="274" font-size="21" fill="#79b8ff" font-weight="400">How can better systems help us recognize</text><text x="46" y="306" font-size="21" fill="#79b8ff" font-weight="400">risk earlier, make better decisions, and</text><text x="46" y="338" font-size="21" fill="#79b8ff" font-weight="400">turn experience into reusable</text><text x="46" y="370" font-size="21" fill="#79b8ff" font-weight="400">intelligence?</text><text x="28" y="430" font-size="21" fill="#b9c3ce" font-weight="400">GitHub is my public lab for exploring that</text><text x="28" y="462" font-size="21" fill="#b9c3ce" font-weight="400">question.</text><g transform="translate(28 519) scale(0.8888888888888888)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l11 4v9c0 7-5 12-11 15C10 28 5 23 5 16V7z"/></g><text x="76" y="537" font-size="19" fill="#eef3f8" font-weight="600">SAFETY</text><text x="76" y="562" font-size="18" fill="#b9c3ce" font-weight="400">People · Assets · Operations</text><g transform="translate(28 583) scale(0.8888888888888888)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3h6l1 5 4 2 5-1 3 5-4 4v4l3 4-3 5-5-2-4 2-1 5h-6l-1-5-4-2-5 2-3-5 3-4v-4l-4-4 3-5 5 1 4-2z"/><circle cx="16" cy="19" r="5"/></g><text x="76" y="601" font-size="19" fill="#eef3f8" font-weight="600">AI &amp; AGENTS</text><text x="76" y="626" font-size="18" fill="#b9c3ce" font-weight="400">Tools · Workflows · Intelligence</text><g transform="translate(28 647) scale(0.8888888888888888)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="6" rx="12" ry="4"/><path d="M4 6v21c0 6 24 6 24 0V6M4 16c0 6 24 6 24 0"/></g><text x="76" y="665" font-size="19" fill="#eef3f8" font-weight="600">KNOWLEDGE SYSTEMS</text><text x="76" y="690" font-size="18" fill="#b9c3ce" font-weight="400">Capture · Distill · Connect · Evolve</text><g transform="translate(28 711) scale(0.8888888888888888)" fill="none" stroke="#80d58a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M29 3C5 3 0 15 7 24s25 4 22-21zM3 32L23 10"/></g><text x="76" y="729" font-size="19" fill="#eef3f8" font-weight="600">SUSTAINABILITY</text><text x="76" y="754" font-size="18" fill="#b9c3ce" font-weight="400">Safer · Smarter · More Resilient</text><g transform="translate(28 791) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3h6l1 5 4 2 5-1 3 5-4 4v4l3 4-3 5-5-2-4 2-1 5h-6l-1-5-4-2-5 2-3-5 3-4v-4l-4-4 3-5 5 1 4-2z"/><circle cx="16" cy="19" r="5"/></g><text x="72" y="819" font-size="26" fill="#eef3f8" font-weight="600">What I’m Building</text><path d="M28 834h584" stroke="#27323d"/><rect x="28" y="857" width="584" height="326" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(50 881) scale(1.1666666666666667)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7c-7-7-14 2-9 7-7 4-4 13 2 13 0 7 9 7 9 0V6m3 1c7-7 14 2 9 7 7 4 4 13-2 13 0 7-9 7-9 0V6M8 16l5 3m11-3-5 3M9 26l5-3m9 3-4-3"/></g><text x="110" y="901" font-size="24" fill="#79b8ff" font-weight="600">JoeyOS</text><text x="110" y="931" font-size="19" fill="#79b8ff" font-weight="400">Personal AI / Knowledge OS</text><text x="52" y="977" font-size="21" fill="#b9c3ce" font-weight="400">An AI-native personal knowledge operating</text><text x="52" y="1008" font-size="21" fill="#b9c3ce" font-weight="400">system designed to become a persistent</text><text x="52" y="1039" font-size="21" fill="#b9c3ce" font-weight="400">context and intelligence layer across tools,</text><text x="52" y="1070" font-size="21" fill="#b9c3ce" font-weight="400">models, and time.</text><rect x="52" y="1135" width="57" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="67" y="1156" font-size="15" fill="#eef3f8" font-weight="400">PKM</text><rect x="121" y="1135" width="111" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="136" y="1156" font-size="15" fill="#eef3f8" font-weight="400">AI Agents</text><rect x="244" y="1135" width="93" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="259" y="1156" font-size="15" fill="#eef3f8" font-weight="400">Systems</text><rect x="28" y="1209" width="584" height="326" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(50 1233) scale(1.1666666666666667)" fill="none" stroke="#80d58a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l11 4v9c0 7-5 12-11 15C10 28 5 23 5 16V7z"/></g><text x="110" y="1253" font-size="24" fill="#79b8ff" font-weight="600">Safety Intelligence</text><text x="110" y="1283" font-size="19" fill="#79b8ff" font-weight="400">AI × Risk × Real-world Impact</text><text x="52" y="1329" font-size="21" fill="#b9c3ce" font-weight="400">Exploring how AI can strengthen safety and</text><text x="52" y="1360" font-size="21" fill="#b9c3ce" font-weight="400">operational risk management through data,</text><text x="52" y="1391" font-size="21" fill="#b9c3ce" font-weight="400">systems and better decision support.</text><rect x="52" y="1487" width="84" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="67" y="1508" font-size="15" fill="#eef3f8" font-weight="400">Safety</text><rect x="148" y="1487" width="66" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="163" y="1508" font-size="15" fill="#eef3f8" font-weight="400">Risk</text><rect x="226" y="1487" width="111" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="241" y="1508" font-size="15" fill="#eef3f8" font-weight="400">Analytics</text><rect x="28" y="1561" width="584" height="326" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(50 1585) scale(1.1666666666666667)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3h6l1 5 4 2 5-1 3 5-4 4v4l3 4-3 5-5-2-4 2-1 5h-6l-1-5-4-2-5 2-3-5 3-4v-4l-4-4 3-5 5 1 4-2z"/><circle cx="16" cy="19" r="5"/></g><text x="110" y="1605" font-size="24" fill="#79b8ff" font-weight="600">AI Workflows</text><text x="110" y="1635" font-size="19" fill="#79b8ff" font-weight="400">Tools / Agents / Automation</text><text x="52" y="1681" font-size="21" fill="#b9c3ce" font-weight="400">Building small, purpose-built tools, agents</text><text x="52" y="1712" font-size="21" fill="#b9c3ce" font-weight="400">and workflows that improve professional</text><text x="52" y="1743" font-size="21" fill="#b9c3ce" font-weight="400">judgment and support recurring work.</text><rect x="52" y="1839" width="84" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="67" y="1860" font-size="15" fill="#eef3f8" font-weight="400">Agents</text><rect x="148" y="1839" width="120" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="163" y="1860" font-size="15" fill="#eef3f8" font-weight="400">Automation</text><rect x="280" y="1839" width="75" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="295" y="1860" font-size="15" fill="#eef3f8" font-weight="400">Tools</text><g transform="translate(28 1923) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="10"/><path d="M21 21l10 10"/></g><text x="72" y="1951" font-size="26" fill="#eef3f8" font-weight="600">Key Questions I’m Exploring</text><path d="M28 1966h584" stroke="#27323d"/><text x="31" y="1999" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="56" y="1999" font-size="21" fill="#b9c3ce" font-weight="400">Can AI identify weak signals before they</text><text x="56" y="2030" font-size="21" fill="#b9c3ce" font-weight="400">become incidents?</text><text x="31" y="2073" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="56" y="2073" font-size="21" fill="#b9c3ce" font-weight="400">How can organizational experience become</text><text x="56" y="2104" font-size="21" fill="#b9c3ce" font-weight="400">reusable intelligence?</text><text x="31" y="2147" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="56" y="2147" font-size="21" fill="#b9c3ce" font-weight="400">How should humans and AI work together when</text><text x="56" y="2178" font-size="21" fill="#b9c3ce" font-weight="400">judgment matters?</text><text x="31" y="2221" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="56" y="2221" font-size="21" fill="#b9c3ce" font-weight="400">What does a knowledge system look like with</text><text x="56" y="2252" font-size="21" fill="#b9c3ce" font-weight="400">AI as a permanent collaborator?</text><g transform="translate(28 2303) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="13"/><circle cx="16" cy="16" r="7"/><path d="M16 16L30 2m-1 0v7h-7"/></g><text x="72" y="2331" font-size="26" fill="#eef3f8" font-weight="600">My Approach</text><path d="M28 2346h584" stroke="#27323d"/><text x="36" y="2379" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="62" y="2379" font-size="21" fill="#b9c3ce" font-weight="400">Observe the signal</text><text x="36" y="2412" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="62" y="2412" font-size="21" fill="#b9c3ce" font-weight="400">Preserve the context</text><text x="36" y="2445" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="62" y="2445" font-size="21" fill="#b9c3ce" font-weight="400">Improve the decision</text><text x="36" y="2478" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="62" y="2478" font-size="21" fill="#b9c3ce" font-weight="400">Capture the learning</text><g transform="translate(28 2518) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7C10 3 5 3 1 5v24c5-2 10-2 15 2 5-4 10-4 15-2V5c-4-2-9-2-15 2zM16 7v24"/></g><text x="72" y="2546" font-size="26" fill="#eef3f8" font-weight="600">Current Projects</text><path d="M28 2561h584" stroke="#27323d"/><rect x="28" y="2582" width="284" height="135" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(44 2600) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7C10 3 5 3 1 5v24c5-2 10-2 15 2 5-4 10-4 15-2V5c-4-2-9-2-15 2zM16 7v24"/></g><text x="83" y="2620" font-size="17" fill="#eef3f8" font-weight="600">JoeyOS</text><text x="46" y="2656" font-size="16" fill="#b9c3ce" font-weight="400">Personal knowledge</text><text x="46" y="2679" font-size="16" fill="#b9c3ce" font-weight="400">infrastructure for the</text><text x="46" y="2702" font-size="16" fill="#b9c3ce" font-weight="400">AI era.</text><rect x="328" y="2582" width="284" height="135" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(344 2600) scale(0.8333333333333334)" fill="none" stroke="#80d58a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l11 4v9c0 7-5 1