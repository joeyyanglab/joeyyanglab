<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1386" viewBox="0 0 1200 1386" role="img" aria-labelledby="title"><title id="title">Joey Yang Lab dashboard: safety systems, AI and knowledge infrastructure</title><rect width="1200" height="1386" rx="16" fill="#0d1117"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="28" y="65" font-size="42" fill="#eef3f8" font-weight="700">Hey, I’m Joey</text><text x="28" y="105" font-size="21" fill="#eef3f8" font-weight="600">Safety Systems × AI × Knowledge Infrastructure</text><text x="28" y="160" font-size="19" fill="#b9c3ce" font-weight="400">I work at the intersection of safety, operational risk, AI, and knowledge</text><text x="28" y="189" font-size="19" fill="#b9c3ce" font-weight="400">systems. My main interest is simple:</text><text x="52" y="240" font-size="20" fill="#79b8ff" font-weight="400">How can better systems help us recognize risk earlier, make better</text><text x="52" y="271" font-size="20" fill="#79b8ff" font-weight="400">decisions, and turn experience into reusable intelligence?</text><path d="M32 215v90" stroke="#79b8ff" stroke-width="2"/><text x="28" y="344" font-size="20" fill="#b9c3ce" font-weight="400">GitHub is my public lab for exploring that question.</text><path d="M872 42v310" stroke="#27323d"/><g transform="translate(895 52) scale(0.8888888888888888)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l11 4v9c0 7-5 12-11 15C10 28 5 23 5 16V7z"/></g><text x="942" y="70" font-size="17" fill="#eef3f8" font-weight="600">SAFETY</text><text x="942" y="96" font-size="13" fill="#b9c3ce" font-weight="400">People · Assets · Operations</text><g transform="translate(895 126) scale(0.8888888888888888)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3h6l1 5 4 2 5-1 3 5-4 4v4l3 4-3 5-5-2-4 2-1 5h-6l-1-5-4-2-5 2-3-5 3-4v-4l-4-4 3-5 5 1 4-2z"/><circle cx="16" cy="19" r="5"/></g><text x="942" y="144" font-size="17" fill="#eef3f8" font-weight="600">AI &amp; AGENTS</text><text x="942" y="170" font-size="13" fill="#b9c3ce" font-weight="400">Tools · Workflows · Intelligence</text><g transform="translate(895 200) scale(0.8888888888888888)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="6" rx="12" ry="4"/><path d="M4 6v21c0 6 24 6 24 0V6M4 16c0 6 24 6 24 0"/></g><text x="942" y="218" font-size="17" fill="#eef3f8" font-weight="600">KNOWLEDGE SYSTEMS</text><text x="942" y="244" font-size="13" fill="#b9c3ce" font-weight="400">Capture · Distill · Connect · Evolve</text><g transform="translate(895 274) scale(0.8888888888888888)" fill="none" stroke="#80d58a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M29 3C5 3 0 15 7 24s25 4 22-21zM3 32L23 10"/></g><text x="942" y="292" font-size="17" fill="#eef3f8" font-weight="600">SUSTAINABILITY</text><text x="942" y="318" font-size="13" fill="#b9c3ce" font-weight="400">Safer · Smarter · More Resilient</text><g transform="translate(28 377) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3h6l1 5 4 2 5-1 3 5-4 4v4l3 4-3 5-5-2-4 2-1 5h-6l-1-5-4-2-5 2-3-5 3-4v-4l-4-4 3-5 5 1 4-2z"/><circle cx="16" cy="19" r="5"/></g><text x="72" y="405" font-size="26" fill="#eef3f8" font-weight="600">What I’m Building</text><path d="M28 420h1144" stroke="#27323d"/><rect x="28" y="443" width="372" height="362" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(50 467) scale(1.1666666666666667)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7c-7-7-14 2-9 7-7 4-4 13 2 13 0 7 9 7 9 0V6m3 1c7-7 14 2 9 7 7 4 4 13-2 13 0 7-9 7-9 0V6M8 16l5 3m11-3-5 3M9 26l5-3m9 3-4-3"/></g><text x="110" y="487" font-size="21" fill="#79b8ff" font-weight="600">JoeyOS</text><text x="110" y="517" font-size="16" fill="#79b8ff" font-weight="400">Personal AI / Knowledge OS</text><text x="52" y="563" font-size="19" fill="#b9c3ce" font-weight="400">An AI-native personal</text><text x="52" y="594" font-size="19" fill="#b9c3ce" font-weight="400">knowledge operating system</text><text x="52" y="625" font-size="19" fill="#b9c3ce" font-weight="400">designed to become a</text><text x="52" y="656" font-size="19" fill="#b9c3ce" font-weight="400">persistent context and</text><text x="52" y="687" font-size="19" fill="#b9c3ce" font-weight="400">intelligence layer across</text><text x="52" y="718" font-size="19" fill="#b9c3ce" font-weight="400">tools, models, and time.</text><rect x="52" y="757" width="57" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="67" y="778" font-size="15" fill="#eef3f8" font-weight="400">PKM</text><rect x="121" y="757" width="111" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="136" y="778" font-size="15" fill="#eef3f8" font-weight="400">AI Agents</text><rect x="244" y="757" width="93" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="259" y="778" font-size="15" fill="#eef3f8" font-weight="400">Systems</text><rect x="414" y="443" width="372" height="362" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(436 467) scale(1.1666666666666667)" fill="none" stroke="#80d58a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l11 4v9c0 7-5 12-11 15C10 28 5 23 5 16V7z"/></g><text x="496" y="487" font-size="21" fill="#79b8ff" font-weight="600">Safety Intelligence</text><text x="496" y="517" font-size="16" fill="#79b8ff" font-weight="400">AI × Risk × Real-world Impact</text><text x="438" y="563" font-size="19" fill="#b9c3ce" font-weight="400">Exploring how AI can</text><text x="438" y="594" font-size="19" fill="#b9c3ce" font-weight="400">strengthen safety and</text><text x="438" y="625" font-size="19" fill="#b9c3ce" font-weight="400">operational risk management</text><text x="438" y="656" font-size="19" fill="#b9c3ce" font-weight="400">through data, systems and</text><text x="438" y="687" font-size="19" fill="#b9c3ce" font-weight="400">better decision support.</text><rect x="438" y="757" width="84" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="453" y="778" font-size="15" fill="#eef3f8" font-weight="400">Safety</text><rect x="534" y="757" width="66" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="549" y="778" font-size="15" fill="#eef3f8" font-weight="400">Risk</text><rect x="612" y="757" width="111" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="627" y="778" font-size="15" fill="#eef3f8" font-weight="400">Analytics</text><rect x="800" y="443" width="372" height="362" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(822 467) scale(1.1666666666666667)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3h6l1 5 4 2 5-1 3 5-4 4v4l3 4-3 5-5-2-4 2-1 5h-6l-1-5-4-2-5 2-3-5 3-4v-4l-4-4 3-5 5 1 4-2z"/><circle cx="16" cy="19" r="5"/></g><text x="882" y="487" font-size="21" fill="#79b8ff" font-weight="600">AI Workflows</text><text x="882" y="517" font-size="16" fill="#79b8ff" font-weight="400">Tools / Agents / Automation</text><text x="824" y="563" font-size="19" fill="#b9c3ce" font-weight="400">Building small, purpose-</text><text x="824" y="594" font-size="19" fill="#b9c3ce" font-weight="400">built tools, agents and</text><text x="824" y="625" font-size="19" fill="#b9c3ce" font-weight="400">workflows that improve</text><text x="824" y="656" font-size="19" fill="#b9c3ce" font-weight="400">professional judgment and</text><text x="824" y="687" font-size="19" fill="#b9c3ce" font-weight="400">support recurring work.</text><rect x="824" y="757" width="84" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="839" y="778" font-size="15" fill="#eef3f8" font-weight="400">Agents</text><rect x="920" y="757" width="120" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="935" y="778" font-size="15" fill="#eef3f8" font-weight="400">Automation</text><rect x="1052" y="757" width="75" height="30" rx="15" fill="#1c2631" stroke="#27323d"/><text x="1067" y="778" font-size="15" fill="#eef3f8" font-weight="400">Tools</text><g transform="translate(28 827) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="10"/><path d="M21 21l10 10"/></g><text x="72" y="855" font-size="26" fill="#eef3f8" font-weight="600">Key Questions I’m Exploring</text><path d="M28 870h820" stroke="#27323d"/><text x="31" y="903" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="56" y="903" font-size="18" fill="#b9c3ce" font-weight="400">Can AI identify weak signals before they become incidents?</text><text x="31" y="946" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="56" y="946" font-size="18" fill="#b9c3ce" font-weight="400">How can organizational experience become reusable intelligence?</text><text x="31" y="989" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="56" y="989" font-size="18" fill="#b9c3ce" font-weight="400">How should humans and AI work together when judgment matters?</text><text x="31" y="1032" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="56" y="1032" font-size="18" fill="#b9c3ce" font-weight="400">What does a knowledge system look like with AI as a permanent collaborator?</text><g transform="translate(900 827) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="13"/><circle cx="16" cy="16" r="7"/><path d="M16 16L30 2m-1 0v7h-7"/></g><text x="944" y="855" font-size="26" fill="#eef3f8" font-weight="600">My Approach</text><path d="M900 870h272" stroke="#27323d"/><text x="908" y="903" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="934" y="903" font-size="18" fill="#b9c3ce" font-weight="400">Observe the signal</text><text x="908" y="936" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="934" y="936" font-size="18" fill="#b9c3ce" font-weight="400">Preserve the context</text><text x="908" y="969" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="934" y="969" font-size="18" fill="#b9c3ce" font-weight="400">Improve the decision</text><text x="908" y="1002" font-size="22" fill="#79b8ff" font-weight="400">•</text><text x="934" y="1002" font-size="18" fill="#b9c3ce" font-weight="400">Capture the learning</text><g transform="translate(28 1069) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7C10 3 5 3 1 5v24c5-2 10-2 15 2 5-4 10-4 15-2V5c-4-2-9-2-15 2zM16 7v24"/></g><text x="72" y="1097" font-size="26" fill="#eef3f8" font-weight="600">Current Projects</text><path d="M28 1112h1144" stroke="#27323d"/><rect x="28" y="1133" width="276" height="135" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(44 1151) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7C10 3 5 3 1 5v24c5-2 10-2 15 2 5-4 10-4 15-2V5c-4-2-9-2-15 2zM16 7v24"/></g><text x="83" y="1171" font-size="16" fill="#eef3f8" font-weight="600">JoeyOS</text><text x="46" y="1207" font-size="16" fill="#b9c3ce" font-weight="400">Personal knowledge</text><text x="46" y="1230" font-size="16" fill="#b9c3ce" font-weight="400">infrastructure for the</text><text x="46" y="1253" font-size="16" fill="#b9c3ce" font-weight="400">AI era.</text><rect x="317" y="1133" width="276" height="135" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(333 1151) scale(0.8333333333333334)" fill="none" stroke="#80d58a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l11 4v9c0 7-5 12-11 15C10 28 5 23 5 16V7z"/></g><text x="372" y="1171" font-size="16" fill="#eef3f8" font-weight="600">Safety Intelligence Lab</text><text x="335" y="1207" font-size="16" fill="#b9c3ce" font-weight="400">AI × safety × risk</text><text x="335" y="1230" font-size="16" fill="#b9c3ce" font-weight="400">experiments and</text><text x="335" y="1253" font-size="16" fill="#b9c3ce" font-weight="400">frameworks.</text><rect x="606" y="1133" width="276" height="135" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(622 1151) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3h6l1 5 4 2 5-1 3 5-4 4v4l3 4-3 5-5-2-4 2-1 5h-6l-1-5-4-2-5 2-3-5 3-4v-4l-4-4 3-5 5 1 4-2z"/><circle cx="16" cy="19" r="5"/></g><text x="661" y="1171" font-size="16" fill="#eef3f8" font-weight="600">AI Workflows</text><text x="624" y="1207" font-size="16" fill="#b9c3ce" font-weight="400">Agents, skills and</text><text x="624" y="1230" font-size="16" fill="#b9c3ce" font-weight="400">repeatable automation</text><text x="624" y="1253" font-size="16" fill="#b9c3ce" font-weight="400">tools.</text><rect x="895" y="1133" width="276" height="135" rx="8" fill="#131b23" stroke="#27323d"/><g transform="translate(911 1151) scale(0.8333333333333334)" fill="none" stroke="#79b8ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h14l8 8v22H6zM20 2v9h8M11 17h12m-12 6h12"/></g><text x="950" y="1171" font-size="16" fill="#eef3f8" font-weight="600">Field Notes</text><text x="913" y="1207" font-size="16" fill="#b9c3ce" font-weight="400">Research, frameworks,</text><text x="913" y="1230" font-size="16" fill="#b9c3ce" font-weight="400">lessons and ideas.</text><path d="M28 1306h1144" stroke="#27323d"/><text x="28" y="1350" font-size="25" fill="#eef3f8" font-weight="600">Joey Yang Lab</text><text x="265" y="1349" font-size="16" fill="#79b8ff" font-weight="400">Building safer systems. Thinking across disciplines. Turning experience into intelligence.</text></g></svg>