<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Current projects at Joey Yang Lab</title>
<desc id="desc">Four active workstreams: JoeyOS, Safety Intelligence Lab, AI Workflows, and Field Notes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#071320"/>
    <stop offset="100%" stop-color="#0d2137"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d2034"/>
    <stop offset="100%" stop-color="#0a192a"/>
  </linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#7898b6" stroke-width="1" opacity=".07"/>
  </pattern>
  <style>
    .eyebrow{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#6ec8ef}
    .title{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#f5f9fd}
    .type{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#73c9ee}
    .desc{font:500 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#b2c5d8}
    .label{font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#d9e9f5}
    .muted{font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#7894ad}
    .card{fill:url(#card);stroke:#284964;stroke-width:1.5}
    .rule{stroke:#294b66;stroke-width:1}
    .accent{fill:#6ec8ef}
  </style>
</defs>

<rect width="1600" height="820" rx="24" fill="url(#bg)"/>
<rect width="1600" height="820" rx="24" fill="url(#grid)"/>

<text class="eyebrow" x="96" y="78">CURRENT PROJECTS · ACTIVE LAB WORKSTREAMS</text>
<text class="muted" x="96" y="112">Different surfaces of the same problem: turning experience and information into better systems and decisions.</text>

<!-- JoeyOS -->
<g transform="translate(90 158)">
  <rect class="card" width="680" height="270" rx="20"/>
  <circle class="accent" cx="42" cy="42" r="7"/>
  <text class="type" x="64" y="48">SYSTEM</text>
  <text class="title" x="34" y="102">JoeyOS</text>
  <text class="desc" x="34" y="142">Personal AI and knowledge infrastructure</text>
  <line class="rule" x1="34" y1="170" x2="646" y2="170"/>
  <text class="label" x="34" y="207">Context · Memory · Knowledge · Provenance</text>
  <text class="muted" x="34" y="238">Human-owned infrastructure for durable, multi-AI work.</text>
</g>

<!-- Safety -->
<g transform="translate(830 158)">
  <rect class="card" width="680" height="270" rx="20"/>
  <circle class="accent" cx="42" cy="42" r="7"/>
  <text class="type" x="64" y="48">DOMAIN LAB</text>
  <text class="title" x="34" y="102">Safety Intelligence Lab</text>
  <text class="desc" x="34" y="142">AI × safety × operational risk</text>
  <line class="rule" x1="34" y1="170" x2="646" y2="170"/>
  <text class="label" x="34" y="207">Signals · Risk · Incidents · Assurance</text>
  <text class="muted" x="34" y="238">Experiments for earlier recognition and better risk decisions.</text>
</g>

<!-- AI workflows -->
<g transform="translate(90 486)">
  <rect class="card" width="680" height="270" rx="20"/>
  <circle class="accent" cx="42" cy="42" r="7"/>
  <text class="type" x="64" y="48">TOOLING</text>
  <text class="title" x="34" y="102">AI Workflows</text>
  <text class="desc" x="34" y="142">Small tools for recurring professional work</text>
  <line class="rule" x1="34" y1="170" x2="646" y2="170"/>
  <text class="label" x="34" y="207">Agents · Skills · Analysis · Outputs</text>
  <text class="muted" x="34" y="238">Purpose-built workflows where context and judgment matter.</text>
</g>

<!-- Field notes -->
<g transform="translate(830 486)">
  <rect class="card" width="680" height="270" rx="20"/>
  <circle class="accent" cx="42" cy="42" r="7"/>
  <text class="type" x="64" y="48">RESEARCH</text>
  <text class="title" x="34" y="102">Field Notes</text>
  <text class="desc" x="34" y="142">Frameworks, lessons, references, and experiments</text>
  <line class="rule" x1="34" y1="170" x2="646" y2="170"/>
  <text class="label" x="34" y="207">Research · Patterns · Decisions · Learning</text>
  <text class="muted" x="34" y="238">Working knowledge captured while the Lab evolves.</text>
</g>
</svg>