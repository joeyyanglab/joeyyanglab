<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Joey Yang Lab</title>
  <desc id="desc">Safety Systems, AI, and Knowledge Infrastructure. Signals to Context to Judgment to Decision to Learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0a1728"/>
      <stop offset="100%" stop-color="#0d2138"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#1e81b0" stop-opacity="0.26"/>
      <stop offset="62%" stop-color="#11385d" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#4f6b86" stroke-width="1" opacity="0.12"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .kicker { font: 600 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; letter-spacing: 4px; fill: #7dd3fc; }
      .title { font: 700 76px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; fill: #f5f9ff; }
      .subtitle { font: 500 30px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; fill: #a8bad0; }
      .loop { font: 600 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; fill: #cfe7f6; letter-spacing: 0.4px; }
      .small { font: 500 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; fill: #7f9bb7; }
      .line { stroke: #5bb9e7; stroke-width: 2; opacity: .42; }
      .line2 { stroke: #7dd3fc; stroke-width: 1.4; opacity: .25; }
      .node { fill: #0b2035; stroke: #71c7ec; stroke-width: 2; }
      .node2 { fill: #71c7ec; opacity: .95; }
    </style>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <rect width="1600" height="520" fill="url(#glow)"/>

  <g transform="translate(105 102)">
    <text class="kicker" x="0" y="0">PUBLIC LAB · SYSTEMS · INTELLIGENCE</text>
    <text class="title" x="0" y="92">Joey Yang Lab</text>
    <text class="subtitle" x="2" y="148">Safety Systems × AI × Knowledge Infrastructure</text>

    <line x1="2" y1="192" x2="610" y2="192" stroke="#385777" stroke-width="1"/>

    <text class="small" x="2" y="232">A public workspace for turning professional experience</text>
    <text class="small" x="2" y="260">into reusable systems, tools, knowledge, and better decisions.</text>

    <text class="loop" x="2" y="326">Signals → Context → Judgment → Decision → Learning</text>
  </g>

  <g transform="translate(1000 260)">
    <line class="line" x1="-165" y1="-95" x2="-52" y2="-28"/>
    <line class="line2" x1="-165" y1="-95" x2="34" y2="-120"/>
    <line class="line" x1="-52" y1="-28" x2="76" y2="16"/>
    <line class="line2" x1="34" y1="-120" x2="76" y2="16"/>
    <line class="line" x1="76" y1="16" x2="184" y2="-55"/>
    <line class="line" x1="76" y1="16" x2="160" y2="100"/>
    <line class="line2" x1="-52" y1="-28" x2="-112" y2="94"/>
    <line class="line" x1="-112" y1="94" x2="20" y2="132"/>
    <line class="line2" x1="20" y1="132" x2="160" y2="100"/>
    <line class="line2" x1="184" y1="-55" x2="258" y2="35"/>
    <line class="line" x1="160" y1="100" x2="258" y2="35"/>
    <line class="line2" x1="34" y1="-120" x2="165" y2="-145"/>
    <line class="line2" x1="165" y1="-145" x2="184" y2="-55"/>

    <circle class="node" cx="-165" cy="-95" r="14"/>
    <circle class="node" cx="-52" cy="-28" r="18"/>
    <circle class="node" cx="34" cy="-120" r="12"/>
    <circle class="node" cx="76" cy="16" r="26" filter="url(#softGlow)"/>
    <circle class="node" cx="184" cy="-55" r="15"/>
    <circle class="node" cx="160" cy="100" r="18"/>
    <circle class="node" cx="-112" cy="94" r="13"/>
    <circle class="node" cx="20" cy="132" r="11"/>
    <circle class="node" cx="258" cy="35" r="12"/>
    <circle class="node" cx="165" cy="-145" r="9"/>

    <circle class="node2" cx="76" cy="16" r="7"/>
    <circle class="node2" cx="-52" cy="-28" r="4"/>
    <circle class="node2" cx="160" cy="100" r="4"/>

    <text class="small" x="-48" y="22">context</text>
    <text class="small" x="104" y="-4">judgment</text>
    <text class="small" x="205" y="-78">decision</text>
    <text class="small" x="180" y="132">learning</text>
    <text class="small" x="-233" y="-118">signals</text>
  </g>

  <rect x="0" y="0" width="1600" height="520" fill="none" stroke="#1f3c56" stroke-width="2" opacity=".65"/>
</svg>