<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="t d">
<title id="t">Joey Yang Lab domains</title>
<desc id="d">Three connected domains: Safety Systems, AI and Automation, and Knowledge Infrastructure.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#081321"/><stop offset="100%" stop-color="#0d2138"/>
  </linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#7ea4c8" stroke-width="1" opacity=".08"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  <style>
    .k{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#6ec8ef}
    .h{font:700 30px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#f4f8fd}
    .p{font:500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#b3c5d8}
    .s{font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#d5e7f5}
    .num{font:700 56px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#2d6e96;opacity:.55}
    .card{fill:#0c1b2d;stroke:#284965;stroke-width:1.5}
    .line{stroke:#54b9e6;stroke-width:2;opacity:.38}
  </style>
</defs>
<rect width="1600" height="560" rx="22" fill="url(#bg)"/>
<rect width="1600" height="560" rx="22" fill="url(#grid)"/>
<text class="k" x="100" y="84">THE LAB OPERATES ACROSS THREE CONNECTED DOMAINS</text>
<line class="line" x1="100" y1="112" x2="1500" y2="112"/>

<g transform="translate(95 155)">
  <rect class="card" width="430" height="320" rx="18"/>
  <text class="num" x="32" y="68">01</text>
  <text class="h" x="32" y="116">Safety Systems</text>
  <text class="p" x="32" y="154">Real-world risk, assurance, and learning</text>
  <circle cx="38" cy="194" r="4" fill="#6ec8ef"/><text class="s" x="56" y="200">Weak signals</text>
  <circle cx="38" cy="230" r="4" fill="#6ec8ef"/><text class="s" x="56" y="236">Operational risk</text>
  <circle cx="38" cy="266" r="4" fill="#6ec8ef"/><text class="s" x="56" y="272">Incident learning</text>
  <circle cx="38" cy="302" r="4" fill="#6ec8ef"/><text class="s" x="56" y="308">Decision quality</text>
</g>

<g transform="translate(585 155)">
  <rect class="card" width="430" height="320" rx="18"/>
  <text class="num" x="32" y="68">02</text>
  <text class="h" x="32" y="116">AI &amp; Automation</text>
  <text class="p" x="32" y="154">Purpose-built intelligence for recurring work</text>
  <circle cx="38" cy="194" r="4" fill="#6ec8ef"/><text class="s" x="56" y="200">AI-assisted analysis</text>
  <circle cx="38" cy="230" r="4" fill="#6ec8ef"/><text class="s" x="56" y="236">Agents and skills</text>
  <circle cx="38" cy="266" r="4" fill="#6ec8ef"/><text class="s" x="56" y="272">Repeatable workflows</text>
  <circle cx="38" cy="302" r="4" fill="#6ec8ef"/><text class="s" x="56" y="308">Human-AI collaboration</text>
</g>

<g transform="translate(1075 155)">
  <rect class="card" width="430" height="320" rx="18"/>
  <text class="num" x="32" y="68">03</text>
  <text class="h" x="32" y="116">Knowledge Infrastructure</text>
  <text class="p" x="32" y="154">Persistent context that compounds over time</text>
  <circle cx="38" cy="194" r="4" fill="#6ec8ef"/><text class="s" x="56" y="200">Knowledge architecture</text>
  <circle cx="38" cy="230" r="4" fill="#6ec8ef"/><text class="s" x="56" y="236">Provenance and traceability</text>
  <circle cx="38" cy="266" r="4" fill="#6ec8ef"/><text class="s" x="56" y="272">Persistent context</text>
  <circle cx="38" cy="302" r="4" fill="#6ec8ef"/><text class="s" x="56" y="308">Reusable intelligence</text>
</g>

<path d="M525 315 C550 315 560 315 585 315" class="line"/>
<path d="M1015 315 C1040 315 1050 315 1075 315" class="line"/>
<circle cx="555" cy="315" r="5" fill="#6ec8ef"/><circle cx="1045" cy="315" r="5" fill="#6ec8ef"/>
</svg>